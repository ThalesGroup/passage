name: Deploy Documentation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# Keep builds for different refs independent. Only main can deploy Pages;
# do not cancel a running main deployment.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Classify changes
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run_ci: ${{ steps.paths.outputs.run_ci }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changes that need Python checks
        id: paths
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=''
          # A docs-only commit after a failed code push must not bypass tests.
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            if candidates=$(gh api --method GET \
                "repos/$GITHUB_REPOSITORY/actions/workflows/docs.yml/runs" \
                -f branch="$GITHUB_REF_NAME" -f event=push -f status=success -F per_page=30 \
                --jq '.workflow_runs[].head_sha'); then
              while IFS= read -r sha; do
                if [[ "$sha" =~ ^[0-9a-f]{40}$ && "$sha" != "$GITHUB_SHA" ]] &&
                   git cat-file -e "$sha^{commit}" 2>/dev/null &&
                   git merge-base --is-ancestor "$sha" "$GITHUB_SHA" &&
                   git show "$sha:.github/workflows/docs.yml" | cmp -s - .github/workflows/docs.yml; then
                  base="$sha"
                  break
                fi
              done <<< "$candidates"
            fi
          elif [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            # actions/checkout uses the PR merge commit. Its first parent is
            # the exact base used to build that tree.
            if git rev-parse --verify "$GITHUB_SHA^2" >/dev/null 2>&1; then
              base=$(git rev-parse --verify "$GITHUB_SHA^1") || base=''
            fi
          fi

          run_ci=true
          paths=$(mktemp)
          if [[ "$base" =~ ^[0-9a-f]{40}$ ]] &&
             [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] &&
             git diff --no-renames --name-only -z "$base" "$GITHUB_SHA" -- > "$paths" &&
             [[ -s "$paths" ]]; then
            run_ci=false
            while IFS= read -r -d '' path; do
              case "$path" in
                README.md|CONTRIBUTING.md|CODE_OF_CONDUCT.md|SECURITY.md|USAGE.md|docs/*.md|docs/*.css|docs/*.js|docs/*.html|docs/*.svg|docs/*.png|docs/*.jpg|docs/*.jpeg|docs/*.webp|docs/*.ico)
                  ;;
                *) run_ci=true; break ;;
              esac
            done < "$paths"
          fi
          printf 'run_ci=%s\n' "$run_ci" >> "$GITHUB_OUTPUT"

  # -----------------------------------------------------------------------
  # Build — runs on every configured push and PR so docs failures surface
  # early. A downloadable archive remains available even without Pages.
  # -----------------------------------------------------------------------
  build:
    name: Build site
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # full history for git-revision-date-localized
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.12.6"
          # SHA-256 of the Linux x86_64 GNU archive used by ubuntu-latest.
          checksum: "8681d8921e7d520fb368991dcf5f9c1905b80f5bf2a265a0ed085c8d8e342477"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies (docs group)
        run: uv sync --locked --group docs

      - name: Build documentation
        run: uv run --locked mkdocs build --strict

      # Downloadable copy of the built site from the run page, also while
      # GitHub Pages is unavailable (see the deploy job).
      - name: Upload site archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: passage-docs-site
          path: ./site
          retention-days: 30

      - name: Upload Pages artifact
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          vars.DEPLOY_PAGES == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./site

  python_checks:
    name: Python CI
    needs: changes
    if: needs.changes.outputs.run_ci == 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  checks:
    name: Documentation and applicable CI
    needs: [changes, build, python_checks]
    if: >-
      !cancelled() && (github.event_name != 'push' || !github.event.deleted)
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        shell: bash
        env:
          DIFF_RESULT: ${{ needs.changes.result }}
          DOCS_RESULT: ${{ needs.build.result }}
          CI_REQUIRED: ${{ needs.changes.outputs.run_ci }}
          CI_RESULT: ${{ needs.python_checks.result }}
        run: |
          test "$DIFF_RESULT" = success
          test "$DOCS_RESULT" = success
          case "$CI_REQUIRED:$CI_RESULT" in
            true:success|false:skipped) ;;
            *) exit 1 ;;
          esac

  # -----------------------------------------------------------------------
  # Deploy only from main, after the build and CI checks. Enable Pages with
  # "GitHub Actions" as the source and set DEPLOY_PAGES to "true" when the
  # repository is eligible. Documentation-only changes need the strict build,
  # while changes to code since the last validated snapshot also need CI.
  # -----------------------------------------------------------------------
  deploy:
    name: Deploy to GitHub Pages
    if: >-
      github.event_name == 'push' && !github.event.deleted &&
      github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    needs: [build, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
