name: Deploy Documentation

on:
  push:
    # develop carries the camera-ready work until it is merged into main.
    branches: [main, develop]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"
      - "README.md"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"
      - ".github/workflows/docs.yml"
  # Manual runs build an archive; Pages deployment requires a push to main.
  workflow_dispatch:

permissions:
  contents: read

# Keep builds for different refs independent. Only main can deploy Pages;
# do not cancel a running main deployment.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -----------------------------------------------------------------------
  # Build — runs on every configured push and PR so docs failures surface
  # early. A downloadable archive remains available even without Pages.
  # -----------------------------------------------------------------------
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # full history for git-revision-date-localized
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.12.6"
          # SHA-256 of the Linux x86_64 GNU archive used by ubuntu-latest.
          checksum: "8681d8921e7d520fb368991dcf5f9c1905b80f5bf2a265a0ed085c8d8e342477"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies (docs group)
        run: uv sync --locked --group docs

      - name: Build documentation
        run: uv run --locked mkdocs build --strict

      # Downloadable copy of the built site from the run page, also while
      # GitHub Pages is unavailable (see the deploy job).
      - name: Upload site archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: passage-docs-site
          path: ./site
          retention-days: 30

      - name: Upload Pages artifact
        if: >-
          github.event_name == 'push' && vars.DEPLOY_PAGES == 'true' &&
          github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./site

  publication_checks:
    name: Verify publication
    if: >-
      github.event_name == 'push' && vars.DEPLOY_PAGES == 'true' &&
      github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # -----------------------------------------------------------------------
  # Deploy — on push to main, once GitHub Pages is available.
  # The organisation's plan offers no Pages site for a private repository.
  # When the repository is public: enable Pages with "GitHub Actions" as the
  # source, set the repository variable DEPLOY_PAGES to "true", and push a
  # documentation-relevant change to main. Deployment waits for the site
  # build and the CI checks.
  # -----------------------------------------------------------------------
  deploy:
    name: Deploy to GitHub Pages
    if: >-
      github.event_name == 'push' && vars.DEPLOY_PAGES == 'true' &&
      github.ref == 'refs/heads/main'
    needs: [build, publication_checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
