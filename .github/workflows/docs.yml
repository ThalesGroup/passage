name: Deploy Documentation

on:
  push:
    # develop carries the camera-ready work until it is merged into main.
    branches: [main, develop]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"
      - "README.md"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one Pages deploy at a time, but do not cancel in-progress runs;
# the queue ordering matters because each run replaces the live site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # -----------------------------------------------------------------------
  # Build — runs on every push and PR so docs failures surface early. The
  # built site is uploaded as a Pages artifact that only the deploy job
  # consumes. Decoupled from lint/test in ci.yml on purpose: a docs change
  # ships even when CI is red.
  # -----------------------------------------------------------------------
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for git-revision-date-localized

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies (docs group)
        run: |
          uv sync --group docs
          uv pip install \
            mkdocs-material \
            "mkdocstrings[python]" \
            mkdocs-include-markdown-plugin \
            mkdocs-minify-plugin \
            pymdown-extensions

      - name: Build documentation
        run: uv run mkdocs build --strict

      # Downloadable copy of the built site from the run page, also while
      # GitHub Pages is unavailable (see the deploy job).
      - name: Upload site archive
        uses: actions/upload-artifact@v4
        with:
          name: passage-docs-site
          path: ./site
          retention-days: 30

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  # -----------------------------------------------------------------------
  # Deploy — on push to main or develop, once GitHub Pages is available.
  # The organisation's plan offers no Pages site for a private repository.
  # When the repository is public: enable Pages with "GitHub Actions" as the
  # source, set the repository variable DEPLOY_PAGES to "true", and re-run
  # this workflow. Independent of CI; deploys as soon as `build` succeeds.
  # -----------------------------------------------------------------------
  deploy:
    name: Deploy to GitHub Pages
    if: >-
      github.event_name == 'push' && vars.DEPLOY_PAGES == 'true' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
