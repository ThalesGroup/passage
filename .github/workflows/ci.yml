name: CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------------
  # Lint — Ruff check + format. The documentation workflow also calls this
  # check when publishing GitHub Pages.
  # -----------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.12.6"
          # SHA-256 of the Linux x86_64 GNU archive used by ubuntu-latest.
          checksum: "8681d8921e7d520fb368991dcf5f9c1905b80f5bf2a265a0ed085c8d8e342477"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Ruff check
        run: uv run --locked ruff check src/ tests/

      - name: Ruff format check
        run: uv run --locked ruff format --check src/ tests/

  # -----------------------------------------------------------------------
  # Test — pytest with coverage. The documentation workflow requires both
  # Python versions to pass before publishing GitHub Pages.
  # -----------------------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Isolate unused hosted vcpkg ONNX Runtime recipes
        shell: bash
        run: |
          # Verified tests scan every name in /usr. Preserve unused runner recipes
          # outside all worker runtime trees; keep the runtime prohibition intact.
          vcpkg=/usr/local/share/vcpkg
          for parent in "$vcpkg" "$vcpkg/ports" "$vcpkg/versions" "$vcpkg/versions/o-"; do
            test ! -L "$parent"
          done
          for recipe in onnxruntime onnxruntime-gpu; do
            path="$vcpkg/ports/$recipe"
            if [ -e "$path" ] || [ -L "$path" ]; then
              test ! -L "$path"
              test -d "$path"
              for marker in portfile.cmake vcpkg.json; do
                test ! -L "$path/$marker"
                test -f "$path/$marker"
              done
            fi
          done
          metadata="$vcpkg/versions/o-/onnxruntime-gpu.json"
          if [ -e "$metadata" ] || [ -L "$metadata" ]; then
            test ! -L "$metadata"
            test -f "$metadata"
          fi
          archive=$(mktemp -d "$RUNNER_TEMP/passage-vcpkg-recipes.XXXXXX")
          python - "$archive" "$GITHUB_WORKSPACE" <<'PY'
          import sys
          from pathlib import Path

          archive = Path(sys.argv[1]).resolve()
          roots = [Path("/usr"), Path(sys.argv[2]).resolve(), Path(sys.prefix).resolve(), Path(sys.base_prefix).resolve()]
          if any(archive.is_relative_to(root) for root in roots):
              raise SystemExit("vcpkg recipe archive must be outside worker runtime trees")
          PY
          for recipe in ports/onnxruntime ports/onnxruntime-gpu versions/o-/onnxruntime-gpu.json; do
            if [ -e "$vcpkg/$recipe" ]; then
              mkdir -p "$archive/$(dirname "$recipe")"
              sudo mv -- "$vcpkg/$recipe" "$archive/$recipe"
            fi
          done

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 zstd

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.12.6"
          # SHA-256 of the Linux x86_64 GNU archive used by ubuntu-latest.
          checksum: "8681d8921e7d520fb368991dcf5f9c1905b80f5bf2a265a0ed085c8d8e342477"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run tests with coverage
        run: |
          uv run --locked python --version
          uv run --locked python -c 'import os, sys; assert sys.version_info[:2] == tuple(map(int, os.environ["UV_PYTHON"].split(".")))'
          uv run --locked pytest \
            --cov \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-report=term-missing \
            -x -v

      - name: Upload coverage report
        if: >-
          matrix.python-version == '3.12' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
