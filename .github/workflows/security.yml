name: Security

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    # Keep this check name stable for branch protection.
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.12"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.12.6"
          # SHA-256 of the Linux x86_64 GNU archive used by ubuntu-latest.
          checksum: "8681d8921e7d520fb368991dcf5f9c1905b80f5bf2a265a0ed085c8d8e342477"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Export locked dependencies
        # Include runtime, dev, docs and every optional extra. pip-audit evaluates
        # the exported markers for this Linux/Python 3.12 environment.
        run: uv export --locked --all-groups --all-extras --no-emit-project > "$RUNNER_TEMP/requirements-audit.txt"

      - name: Audit locked dependencies
        # Audit exact locked versions from the hashed export without installing
        # project dependencies (including the large optional torch/CUDA packages).
        # Fail on collection errors and vulnerabilities; no advisory is ignored.
        run: >-
          uvx --from 'pip-audit==2.10.1' pip-audit
          --requirement "$RUNNER_TEMP/requirements-audit.txt"
          --disable-pip --require-hashes --strict
          --vulnerability-service pypi --progress-spinner off
