[build-system]
# A single setuptools project ships
# both `passage` (data-generation pipeline) and `passage_eval` (canonical
# evaluation contract) as a single distribution. Source trees are
# isolated under src/passage/ and src/passage-eval/.
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

# Dependency groups are resolved and locked in uv.lock.
[dependency-groups]
dev = [
  "ipykernel>=7.1.0",
  "nbclient>=0.10.4",
  "plotly>=5.20.0",
  "pre-commit>=4.5.1",
  "pytest>=9.0.3",
  "pytest-cov>=6.0.0",
  "pytest-html>=4.1.0",
  "pytest-xdist>=3.5.0",
  "ruff>=0.14.11",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.7.7",
  "mkdocstrings[python]>=0.28",
  "mkdocs-include-markdown-plugin>=7.1.7",
  "mkdocs-minify-plugin>=0.8",
  "mkdocs-glightbox>=0.4",
  "pymdown-extensions>=11.0.1",
  # Notebook tools are available for users who run or render notebooks locally.
  "nbclient>=0.10.4",
  "nbconvert>=7.17.2",
  "ipykernel>=7.0.0",
  "jupyter_client>=8.0.0",
  # Interactive HTML leaderboard charts embedded in docs/index.md.
  "plotly>=5.20.0",
]

[project]
name = "passage"
version = "1.0.0"
description = "PASSAGE: Path Solving Dataset and Generator + canonical evaluation contract (passage_eval)."
readme = "README.md"
license = {file = "LICENSE"}
authors = [
  {name = "Geoffrey Delhomme", email = "geoffrey.delhomme@thalesgroup.com"},
  {name = "PASSAGE authors"}
]
requires-python = ">=3.11"
dependencies = [
  # passage (data generation) ----------------------------------------------
  "loguru>=0.7.3",
  "opencv-python>=4.0.0",
  "numba>=0.58.0",
  "networkx>=3.0",
  "pathfinding>=1.0.0",
  "requests>=2.33.0",
  # Runtime transitive security floors must also apply to pip installations,
  # which do not consume [tool.uv].constraint-dependencies.
  "filelock>=4.2.1",
  "tornado>=6.6",
  "tqdm>=4.60.0",
  "rasterio>=1.3.0",
  "pyyaml>=6.0",
  "papermill>=2.5.0",
  "imageio>=2.34.0",
  "pyarrow>=23.0.0",
  "datasets>=5.0.1",
  "zstandard>=0.25.0",
  "python-dotenv>=1.0.0",
  "hf-transfer>=0.1.9",
  "huggingface-hub[hf-transfer,hf-xet]>=1.5.0",
  "hf-xet>=1.3.2",
  # passage_eval (canonical evaluation contract) ---------------------------
  "numpy>=1.20.0",
  "scipy>=1.10.0",
  "pandas>=2.0.0",
  "matplotlib>=3.7.0",
]

[project.optional-dependencies]
# Inference-side dependencies for users who want passage-eval to drive
# their planner (the `passage-eval bench` CLI calls into the candidate
# planner's predict() method, optionally on a CUDA device).
torch = [
  "torch>=2.13.0",
  "setuptools>=84.1.0",
]
notebook = [
  "ipykernel>=7.0.0",
]

[project.scripts]
passage = "passage:main"
# `passage-eval` is the entry point for benchmarking new candidate planners
# end-to-end (load data → run inference → compute metrics → submit row).
"passage-eval" = "passage_eval.cli:main"

[project.urls]
Documentation = "https://thalesgroup.github.io/passage/"
Repository = "https://github.com/ThalesGroup/passage"
"Bug Tracker" = "https://github.com/ThalesGroup/passage/issues"
Dataset = "https://huggingface.co/datasets/thalesgroup/passage"

# ---------------------------------------------------------------------------
# Build configuration: ship `passage` AND `passage_eval` from one wheel.
# ---------------------------------------------------------------------------
[tool.setuptools]
# Two source roots, mapped to their import names. The dash in
# `src/passage-eval/` is a directory naming convention; setuptools
# remaps it to the dash-free import name `passage_eval`.
package-dir = {"passage" = "src/passage", "passage_eval" = "src/passage-eval"}
# Sub-packages explicitly listed because `setuptools.packages.find`
# cannot enumerate directories whose on-disk name (`passage-eval`) is
# not a valid Python identifier.
packages = [
    "passage",
    "passage_eval",
    "passage_eval.baselines",
    "passage_eval.campaign",
    "passage_eval.campaign.direct",
    "passage_eval.campaign.edge",
    "passage_eval.campaign.edge.data",
    "passage_eval.deployment",
    "passage_eval.diagnostics",
    "passage_eval.execution",
    "passage_eval.io",
    "passage_eval.metrics",
    "passage_eval.protocol",
    "passage_eval.supervision",
    "passage_eval.trustworthiness",
]

[tool.setuptools.package-data]
"passage" = ["py.typed"]
"passage_eval" = ["py.typed", "campaign/edge/data/*.json"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError"
]

[tool.coverage.run]
source = ["src/passage", "src/passage-eval"]
branch = true
omit = ["*/tests/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--html=outputs/tests/report.html", "--self-contained-html", "--import-mode=importlib"]
markers = [
  "unit: Unit tests (fast, isolated)",
  "integration: Integration tests (may require external resources)",
  "download: Tests for download module",
  "calibrate: Tests for calibrate module",
  "generate: Tests for generate module"
]

[tool.ruff]
line-length = 120
indent-width = 4
show-fixes = true

[tool.ruff.format]
# The frozen reference decoders are pinned by SHA-256 in
# docs/benchmark/final-candidates.json; formatting would change their bytes.
exclude = ["src/passage-eval/baselines/final_decoders.py"]

[tool.uv]
# Pin floors for transitive packages with active CVEs so we never resolve
# to a vulnerable version, without making them direct project deps.
constraint-dependencies = [
  "pygments>=2.20.0",   # CVE-2026-4539
  "aiohttp>=3.14.4",    # GHSA-9xw5-w5jj-pvcg and related advisories
  "anyio>=4.14.2",      # GHSA-82r6-8w77-94w6
  "bleach>=6.4.0",      # Patched URI sanitization; email-linkify issue remains upstream
  "certifi>=2026.10.19", # GHSA-6q48-6c7w-9gw2
  "filelock>=4.2.1",    # GHSA-v4x8-3wr5-3wq8 and related advisories
  "fsspec>=2026.6.0",   # GHSA-27vj-qcqg-25rc; requires datasets>=5
  "idna>=3.15",         # GHSA-65pc-fj4g-8rjx
  "mistune>=3.3.3",     # PYSEC-2026-3863 and related advisories
  "multidict>=6.9.1",   # GHSA-54p9-h82j-f925
  "pillow>=13.0.0",     # GHSA-v9pv-5gc8-w2m6 and related advisories
  "soupsieve>=2.9.0",   # Includes fixes for high and moderate parser issues
  "setuptools>=84.1.0", # GHSA-xmj3-9gf7-h52w
  "tornado>=6.6",       # GHSA-r4j5-9xpp-3985 and related advisories
  "urllib3>=2.8.0",     # GHSA-vxq7-64xx-v4gw and related advisories
  "virtualenv>=21.14.10", # CVE-2026-113713 and related advisories
]
