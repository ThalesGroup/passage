[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "ipykernel>=7.1.0",
  "pre-commit>=4.5.1",
  "pytest>=9.0.2",
  "pytest-cov>=6.0.0",
  "pytest-html>=4.1.0",
  "pytest-xdist>=3.5.0",
  "ruff>=0.14.11"
]

[project]
name = "passage"
version = "0.1.0"
description = "PASSAGE: Path Solving Dataset and Generator"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
  {name = "Geoffrey Delhomme", email = "geoffrey.delhomme@thalesgroup.com"}
]
requires-python = ">=3.11"
dependencies = [
  "loguru>=0.7.3",
  "opencv-python>=4.0.0",
  "numpy>=1.20.0",
  "pandas>=2.0.0",
  "networkx>=3.0",
  "pathfinding>=1.0.0",
  "scipy>=1.10.0",
  "requests>=2.28.0",
  "tqdm>=4.60.0",
  "rasterio>=1.3.0",
  "pyyaml>=6.0",
  "matplotlib>=3.7.0",
  "papermill>=2.5.0",
  "imageio>=2.34.0"
]

[project.scripts]
passage = "passage:main"

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError"
]

[tool.coverage.run]
source = ["src/passage"]
branch = true
omit = ["*/tests/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--html=outputs/tests/report.html", "--self-contained-html"]
markers = [
  "unit: Unit tests (fast, isolated)",
  "integration: Integration tests (may require external resources)",
  "download: Tests for download module",
  "calibrate: Tests for calibrate module",
  "generate: Tests for generate module"
]

[tool.ruff]
line-length = 120
indent-width = 4
show-fixes = true
