[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "ipykernel>=7.1.0",
  "pre-commit>=4.5.1",
  "pytest>=9.0.3",
  "pytest-cov>=6.0.0",
  "pytest-html>=4.1.0",
  "pytest-xdist>=3.5.0",
  "ruff>=0.14.11"
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.6",
  "mkdocstrings[python]>=0.28",
  "mkdocs-include-markdown-plugin>=7.1.7",
  "mkdocs-minify-plugin>=0.8",
  "mkdocs-glightbox>=0.4",
  "pymdown-extensions>=10.0"
]

[project]
name = "passage"
version = "0.1.0"
description = "PASSAGE: Path Solving Dataset and Generator"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
  {name = "Geoffrey Delhomme", email = "geoffrey.delhomme@thalesgroup.com"}
]
requires-python = ">=3.11"
dependencies = [
  "loguru>=0.7.3",
  "opencv-python>=4.0.0",
  "numpy>=1.20.0",
  "numba>=0.58.0",
  "pandas>=2.0.0",
  "networkx>=3.0",
  "pathfinding>=1.0.0",
  "scipy>=1.10.0",
  "requests>=2.33.0",
  "tqdm>=4.60.0",
  "rasterio>=1.3.0",
  "pyyaml>=6.0",
  "matplotlib>=3.7.0",
  "papermill>=2.5.0",
  "imageio>=2.34.0",
  "pyarrow>=23.0.0",
  "datasets>=2.10.2",
  "zstandard>=0.25.0",
  "python-dotenv>=1.0.0",
  "hf-transfer>=0.1.9",
  "huggingface-hub[hf-transfer,hf-xet]>=1.5.0",
  "hf-xet>=1.3.2",
]

[project.optional-dependencies]
# `passage-eval` is the standalone evaluation contract bundled at
# src/passage-eval/. It declares its own pyproject.toml and is fully
# pip-installable on its own (`pip install ./src/passage-eval`); this extra
# is only a convenience entry point for users who install `passage` from a
# source checkout and also want the eval package wired in.
eval = ["passage-eval"]

[project.scripts]
passage = "passage:main"

[project.urls]
Documentation = "https://thalesgroup.github.io/passage/"
Repository = "https://github.com/ThalesGroup/passage"
"Bug Tracker" = "https://github.com/ThalesGroup/passage/issues"
Dataset = "https://huggingface.co/datasets/thalesgroup/passage"

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError"
]

[tool.coverage.run]
source = ["src/passage"]
branch = true
omit = ["*/tests/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--html=outputs/tests/report.html", "--self-contained-html"]
markers = [
  "unit: Unit tests (fast, isolated)",
  "integration: Integration tests (may require external resources)",
  "download: Tests for download module",
  "calibrate: Tests for calibrate module",
  "generate: Tests for generate module"
]

[tool.ruff]
line-length = 120
indent-width = 4
show-fixes = true

# uv workspace declaration: passage-eval lives at src/passage-eval/ as an
# isolated, independently-installable Python package (it carries its own
# pyproject.toml and its own src/passage_eval/ layout). Declaring it here
# lets `uv sync` from the repo root pick up both packages, while
# `pip install ./src/passage-eval` installs the eval contract on its own
# without pulling in the dataset-generation dependency stack.
[tool.uv.workspace]
members = ["src/passage-eval"]

[tool.uv.sources]
passage-eval = { workspace = true }

[tool.uv]
# Pin floors for transitive packages with active CVEs so we never resolve
# to a vulnerable version, without making them direct project deps.
constraint-dependencies = [
  "pygments>=2.20.0",   # CVE-2026-4539
  "aiohttp>=3.13.5",    # CVE-2026-22815, -34513..-34520, -34525
]
