          - "#4-6 | Release Pipeline": guide/export.md
      - "Configuration": guide/configuration.md
      - "Generation Process":
          - "Overview": generation/index.md
          - "Sampling Procedure": generation/sampling.md
          - "Cost Models": generation/cost-models.md
          - "Obstacle Generation": generation/obstacles.md
          - "Solvers & Heuristics": generation/solvers.md
          - "Interactive Notebooks":
              - "Overview": generation/notebooks.md
              - "Executed runs":
                  - "Index": generation/notebooks/index.md
                  - "Demo (load + visualise)": generation/notebooks/demo.md
                  - "Obstacle generation": generation/notebooks/obstacles.md
                  - "Cost model comparison": generation/notebooks/costmodel.md
                  - "Solver comparison": generation/notebooks/solve.md
