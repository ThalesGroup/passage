# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: "PASSAGE"
site_description: "Path Solving Dataset & Generator — Real-world elevation-based pathfinding benchmarks for research"
site_author: "Geoffrey Delhomme"
# SITE_URL lets a preview host (for example a GitLab Pages copy) build with its own
# address; the public site uses the GitHub Pages URL.
site_url: !ENV [SITE_URL, "https://thalesgroup.github.io/passage/"]

# Not published as pages:
# - developer guides read on GitHub, next to the code and receipts they link to
#   (their relative links point outside docs/);
# - fragments that include-markdown reads from disk into other pages;
# - the theme overrides (Jinja templates, read through `theme.custom_dir`).
exclude_docs: |
  /DATA_QUALIFICATION.md
  /TRAJECTORY_STYLE.md
  /_partials/
  /overrides/

repo_url: "https://github.com/ThalesGroup/passage"
repo_name: "ThalesGroup/passage"
copyright: "Copyright &copy; 2024–2026 Thales Group · Code: MIT License · Data: JAXA AW3D30 terms of use"

# ---------------------------------------------------------------------------
# Theme
# ---------------------------------------------------------------------------
theme:
  name: material
  custom_dir: docs/overrides
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg

  icon:
    repo: fontawesome/brands/github
    admonition:
      note: fontawesome/solid/note-sticky
      abstract: fontawesome/solid/book
      info: fontawesome/solid/circle-info
      tip: fontawesome/solid/bullhorn
      success: fontawesome/solid/check
      question: fontawesome/solid/circle-question
      warning: fontawesome/solid/triangle-exclamation
      failure: fontawesome/solid/bomb
      danger: fontawesome/solid/skull
      bug: fontawesome/solid/robot
      example: fontawesome/solid/flask
      quote: fontawesome/solid/quote-left

  palette:
    # Dark first: the neon theme is designed on a night background.
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

  font:
    text: Inter
    code: JetBrains Mono

  features:
    - announce.dismiss
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - header.autohide
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

# ---------------------------------------------------------------------------
# Plugins
# ---------------------------------------------------------------------------
plugins:
  - include-markdown
  - search:
      separator: '[\s\-\.]+'
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          # `src/` holds the `passage` package. `passage_eval` (directory
          # `src/passage-eval/`) is resolved from the installed distribution,
          # which `uv sync` installs in editable mode.
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_category_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            merge_init_into_class: true
            docstring_style: google
            docstring_section_style: spacy
            show_if_no_docstring: false
            annotations_path: brief
            signature_crossrefs: true
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: "100%"
      height: auto
      zoomable: true
      draggable: true
      auto_caption: false
      caption_position: bottom
  - minify:
      minify_html: true
  - tags

# ---------------------------------------------------------------------------
# Markdown extensions
# ---------------------------------------------------------------------------
markdown_extensions:
  # Python-Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3

  # PyMdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# ---------------------------------------------------------------------------
# Extra JavaScript / CSS
# ---------------------------------------------------------------------------
extra_css:
  - https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap
  - assets/extra.css

extra_javascript:
  - javascripts/home.js
  - javascripts/katex.js
  - https://unpkg.com/katex@0.16.11/dist/katex.min.js
  - https://unpkg.com/katex@0.16.11/dist/contrib/auto-render.min.js

extra:
  huggingface:
    link: https://huggingface.co/datasets/thalesgroup/passage
    name: "thalesgroup/passage"
    title: "Dataset on the Hugging Face Hub"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ThalesGroup/passage
      name: GitHub
    - icon: simple/huggingface
      link: https://huggingface.co/datasets/thalesgroup/passage
      name: Hugging Face Dataset
  status:
    new: Recently added
    deprecated: Deprecated
  generator: false

