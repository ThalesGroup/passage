[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[project]
name = "passage-eval"
version = "0.2.0"
description = "PASSAGE evaluation contract: canonical metrics, statistical discipline (paired bootstrap, Holm--Bonferroni, three-seed aggregation), reproducibility sidecar, and deployment-footprint utilities for the PASSAGE benchmark."
readme = "README.md"
license = {text = "MIT"}
authors = [
  {name = "PASSAGE authors"}
]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.20.0",
  "scipy>=1.10.0",
  "pandas>=2.0.0",
]

[project.optional-dependencies]
# Optional surrogate-baseline tooling. The CPU-only PyTorch wheel from
# `download.pytorch.org/whl/cpu` is resolved by default (see [tool.uv.sources]
# below) so that no proprietary NVIDIA CUDA runtime libraries are recorded in
# `uv.lock` or installed for the typical user. GPU users who need the CUDA
# build can override the index at install time, e.g.
#   `pip install torch --index-url https://download.pytorch.org/whl/cu128`
# after `uv sync --extra torch`.
torch = [
  "torch>=2.1.0",
]
notebook = [
  "ipykernel>=7.0.0",
  "matplotlib>=3.7.0",
  "tqdm>=4.60.0",
]
dev = [
  "pytest>=9.0.3",
  "ruff>=0.5.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[project.urls]
Repository = "https://github.com/ThalesGroup/passage"
Dataset = "https://huggingface.co/datasets/thalesgroup/passage"

[tool.ruff]
line-length = 120
indent-width = 4

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
