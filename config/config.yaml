resolutions:
  - 64
  - 128
  - 256
  - 512
  - 1024
  - 2048
  - 4096
num_samples: 10

# Pathfinding solver configuration
# Use a name prefix to select backend:
#   networkx:   NetworkX graph solvers (supports all cost models)
#   pathfinding: pathfinding package solvers (grid-based, no directional cost models)
#   grid:       internal NumPy grid solvers (grid_astar/grid_dijkstra)
# Edge weights = distance_m * (1 + weight * normalized_elevation)
# Cardinal moves: 30m, Diagonal moves: 30*sqrt(2) ≈ 42.43m
solver:
  # Solver name (with prefix):
  #   networkx: astar, astar_bi, dijkstra, dijkstra_bi, bellman_ford, unweighted
  #   pathfinding: astar, dijkstra, best_first
  #   grid: astar, dijkstra (mapped to grid_astar/grid_dijkstra)
  #
  # Example (NetworkX A*):
  #   name: networkx:astar
  # Example (Pathfinding Dijkstra):
  #   name: pathfinding:dijkstra
  # Example (Grid A*):
  #   name: grid:astar
  name: grid:astar

  # Parameters shared by all backends
  common:
    # Diagonal movement - controls graph connectivity:
    #   always  - 8-connectivity (cardinal 30m + diagonal 42.43m) [DEFAULT]
    #   never   - 4-connectivity (cardinal only: N/S/E/W, 30m each)
    diagonal_movement: always

    # Maximum retries for marker sampling before trying new elevation
    max_marker_retries: 10

  # Parameters for NetworkX backend (all cost models supported)
  networkx:
    # Weight multiplier for elevation cost (higher = prefer flat paths)
    # Set very high to strongly penalize high-elevation cells so the path follows valleys more aggressively.
    # Note: this multiplies the normalized elevation term, so large values (100+) heavily favor low-elevation routes.
    weight: 30.0

    # Edge cost model:
    #   elevation          - distance * (1 + weight * normalized_elevation) [DEFAULT]
    #   distance           - flat distance only (ignore elevation)
    #   slope_uphill       - penalize uphill elevation changes (distance-scaled)
    #   energy             - distance + weight * max(0, elevation_gain)
    #   absolute_elevation - distance * (1 + weight * normalized_abs_elevation)
    cost_model: elevation

    # Heuristic function for A* search (used by astar/astar_bi):
    #   euclidean  - Euclidean distance in meters (best for 8-connectivity) [DEFAULT]
    #   manhattan  - Manhattan distance in meters (best for 4-connectivity)
    #   chebyshev  - Chebyshev distance in meters (alternative for 8-connectivity)
    heuristic: euclidean

  # Parameters for pathfinding backend (no directional cost models: slope_uphill, energy)
  pathfinding:
    weight: 30.0
    cost_model: elevation
    heuristic: euclidean

  # Parameters for grid backend (all cost models supported)
  grid:
    weight: 1000.0
    cost_model: elevation
    heuristic: euclidean

# Obstacle generation configuration (used by obstacles notebook)
# Overview:
#  - `ratio_max` controls the maximum fraction of the image that can be occupied by obstacles.
#  - `shape.size.min_ratio` / `shape.size.max_ratio` describe the minimum and maximum *relative* linear size
#    (width/height) for generated superellipses, expressed as fraction of the image width/height.
#    Example: max_ratio: 0.5 means a superellipse may be up to half the image width/height.
#  - `generation` contains procedural tuning parameters that affect how many attempts are made
#    to reach a target obstacle coverage and how many candidate shapes are considered per attempt.
#  - `obstacle_penalty` is added to elevation values for cells marked as obstacles when running
#    pathfinding; set very large to make paths avoid obstacle cells.
obstacles:
  # Enable obstacle generation in dataset samples
  enabled: true

  # Maximum target ratio of obstacles in the image (0.0 - 1.0)
  ratio_max: 0.30

  # Shape-related parameters
  shape:
    size:
      # Superellipse size ratios relative to resolution (simplified defaults)
      # Example: size_max_ratio: 0.5 means a superellipse may be up to half the image width/height.
      min_ratio: 0.02
      max_ratio: 0.25
    n:
      # Superellipse exponent 'n' controls shape (1..100)
      # Defaults chosen to allow both round and rectangular obstacles.
      min: 1.0
      max: 80.0
      # Default distribution to sample superellipse exponent 'n' across [min, max].
      # Supported types: 'log_uniform' (default), 'uniform', 'beta', 'exponential'
      # Example exponential: distribution: { type: exponential, lambda: 2.0 }
      distribution:
        # type: exponential
        # lambda: 2.0
        type: log_uniform

  # Generator tuning parameters (procedural, not shape-specific)
  generation:
    # Number of independent attempts to produce a mask (each attempt draws a new target_ratio)
    max_attempts: 50
    # Number of candidate superellipses to try when building a mask
    candidates_per_mask: 200

  # Penalty added to elevation of obstacle cells during pathfinding (large -> avoided)
  obstacle_penalty: 1e8
